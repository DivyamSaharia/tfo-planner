<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TFO Planner</title>
<meta name="description" content="Day-by-day yarn and TFO planning for Hanuman Weavelon Unit 2">
<meta name="theme-color" content="#002A00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TFO Planner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand"><img src="icons/icon.svg" alt="" width="30" height="30"><div><b>TFO Planner</b><span>Weavelon 2</span></div></div>
    <div class="top-tools">
      <span id="sync" class="sync" title="Sync status"></span>
      <button class="icon-btn" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1L15 3.5h-4l-.4 2.5c-.6.3-1.2.6-1.7 1l-2.4-1-2 3.4 2 1.6a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1c.5.4 1.1.7 1.7 1l.4 2.5h4l.4-2.5c.6-.3 1.2-.6 1.7-1l2.4 1 2-3.4-2-1.6ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/></svg></button>
    </div>
  </div>
  <div class="top-row ctl">
    <label class="date-ctl"><span>Plan date</span><input type="date" id="plan-date"></label>
    <div class="seg" id="win" role="group" aria-label="Plan window">
      <span class="seg-lbl">Days</span><button data-act="win" data-v="3">3</button><button data-act="win" data-v="5">5</button><button data-act="win" data-v="7">7</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Screens"></nav>
</header>
<main id="main" tabindex="-1"></main>
<dialog id="sheet"><form method="dialog" id="sheet-body"></form></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
